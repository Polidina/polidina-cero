<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title> yo pray | cero* | ゼロ </title>
  <!-- Favicon personalizado -->
  <link rel="icon" type="image/png" href="cerito.png">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      cursor: none; 
    }
    canvas {
      display: block;
      cursor: none;
    }

    /* --- BARRA DE NAVEGACIÓN SUPERIOR --- */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px; 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
      pointer-events: none; 
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
      pointer-events: auto; 
    }

    .nav-right {
      margin-right: 5px; 
    }

    .btn-img {
      height: 60px; 
      cursor: none; 
      transition: transform 0.2s ease;
      transform: rotate(-2.5deg);
    }

    .btn-img:nth-child(even) {
      transform: rotate(2deg);
    }

    .btn-img:hover {
      transform: scale(1.08);
    }

    .btn-creditos-img {
      height: 60px; 
      cursor: none;
      transition: transform 0.2s ease;
      transform: rotate(2.5deg);
    }

    .btn-creditos-img:hover {
      transform: scale(1.08);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>

  <!-- Barra superior con botones de música y créditos -->
  <header class="nav-bar">
      <div class="nav-left">
          <a href="https://open.spotify.com/intl-es/album/1oewbFslWDSzh9Rl7Y483n?si=_b7RBWDRSle_JelfGIUpLg&nd=1&dlsi=7c83b2c8a82b461a" target="_blank">
              <img src="spotify.png" alt="Spotify" class="btn-img">
          </a>
          <a href="https://music.apple.com/ar/album/yo-pray/6794937668" target="_blank">
              <img src="apple music.png" alt="Apple Music" class="btn-img">
          </a>
          <a href="https://www.youtube.com/watch?v=P3XPnvSqcIo&list=OLAK5uy_ma5mWTG930Aj0sepyDvZHS6kKsjOudQjc" target="_blank">
              <img src="youtube.png" alt="YouTube" class="btn-img">
          </a>
      </div>
      <div class="nav-right">
          <a href="https://www.instagram.com/polidina/" target="_blank">
              <img src="creditos.png" alt="Créditos" class="btn-creditos-img">
          </a>
      </div>
  </header>

  <script>
    let imgFondo, imgRostro, imgRestoOjos, imgPupilas, imgClick, imgPez, imgCamara;
    let imgComprar, imgTickets, imgJapon, imgEstrella, imgFlecha;
    let imgCartel, imgAuriculares, imgConejo, imgComprarTuchi, imgCero;
    let imgPolaroid20, imgPolaroid21, imgPolaroid22, imgPolaroid23, imgPolaroid24, imgPolaroid25;

    let anchoOriginal = 1728;
    let altoOriginal = 3526; 

    let posYOriginal = 470; 

    // Posición y rotación de la cámara
    let camaraXOriginal = 1420; 
    let camaraYOriginal = 720;  
    let rotacionCamara = 5.0;   

    // Posiciones horizontales de los botones inferiores
    let comprarXOriginal = 300;
    let ticketsXOriginal = 864; 
    let japonXOriginal = 1428;
    let botonesYOriginal = 939; 

    // Variables para la animación suave (hover) de los botones inferiores
    let hoverComprar = 1.0;
    let hoverTickets = 1.0;
    let hoverJapon = 1.0;
    let hoverComprarTuchi = 1.0;

    let relOjoX = -85;
    let relOjoY = 45;

    let factorTamano = 0.8;
    let escalaZoom = 1.0;
    let impulsoClick = 0.0;

    let peces = [];
    let polaroids = []; 
    let objCero; 

    function preload() {
      imgFondo = loadImage(encodeURI('fondo.png'));
      imgRostro = loadImage(encodeURI('resto de rostro.png'));
      imgRestoOjos = loadImage(encodeURI('resto de ojos.png'));
      imgPupilas = loadImage(encodeURI('pupilas.png'));
      imgClick = loadImage(encodeURI('click.png'));
      imgPez = loadImage(encodeURI('pecesito.png'));
      imgCamara = loadImage(encodeURI('camara.png')); 
      
      imgComprar = loadImage(encodeURI('comprar.png'));
      imgTickets = loadImage(encodeURI('tickets.png'));
      imgJapon = loadImage(encodeURI('japon.png'));
      imgEstrella = loadImage(encodeURI('estrella.png'));
      imgFlecha = loadImage(encodeURI('flecha.png'));

      imgCartel = loadImage(encodeURI('cartel.png'));
      imgAuriculares = loadImage(encodeURI('auriculares.png'));
      imgConejo = loadImage(encodeURI('conejo.png'));
      imgComprarTuchi = loadImage(encodeURI('comprartuchi.png'));
      imgCero = loadImage(encodeURI('cero.png'));

      imgPolaroid20 = loadImage(encodeURI('image 20.png'));
      imgPolaroid21 = loadImage(encodeURI('image 21.png'));
      imgPolaroid22 = loadImage(encodeURI('image 22.png'));
      imgPolaroid23 = loadImage(encodeURI('image 23.png'));
      imgPolaroid24 = loadImage(encodeURI('image 24.png'));
      imgPolaroid25 = loadImage(encodeURI('image 25.png'));
    }

    function setup() {
      let altoCalculado = windowWidth * (altoOriginal / anchoOriginal);
      createCanvas(windowWidth, altoCalculado);
      imageMode(CENTER);

      for (let i = 0; i < 12; i++) {
        peces.push(new Pez(random(100, width - 100), random(100, height - 100), true));
      }

      let cartelX = width / 2;
      let bY = botonesYOriginal * (width / anchoOriginal);
      let cartelY = bY + (580 * (width / anchoOriginal));
      let comprarTuchiY = cartelY + (640 * (width / anchoOriginal));
      let basePolaroidsY = comprarTuchiY + (470 * (width / anchoOriginal)); 
      let escalaP = 1.05;

      // Creamos las polaroids
      polaroids.push(new Polaroid(cartelX - (440 * (width / anchoOriginal)), basePolaroidsY, imgPolaroid20, -6, escalaP));
      polaroids.push(new Polaroid(cartelX - (110 * (width / anchoOriginal)), basePolaroidsY - (30 * (width / anchoOriginal)), imgPolaroid21, -25, escalaP));
      polaroids.push(new Polaroid(cartelX - (190 * (width / anchoOriginal)), basePolaroidsY + (340 * (width / anchoOriginal)), imgPolaroid23, 2, escalaP));
      polaroids.push(new Polaroid(cartelX + (110 * (width / anchoOriginal)), basePolaroidsY + (380 * (width / anchoOriginal)), imgPolaroid24, 4, escalaP));
      polaroids.push(new Polaroid(cartelX + (380 * (width / anchoOriginal)), basePolaroidsY - (70 * (width / anchoOriginal)), imgPolaroid22, 8, escalaP));
      polaroids.push(new Polaroid(cartelX + (390 * (width / anchoOriginal)), basePolaroidsY + (320 * (width / anchoOriginal)), imgPolaroid25, -4, escalaP));

      // Creamos el objeto cero.png en el extremo izquierdo
      objCero = new Polaroid(cartelX - (470 * (width / anchoOriginal)), basePolaroidsY + (370 * (width / anchoOriginal)), imgCero, -4, 0.9);
    }

    function draw() {
      background(0);

      let escala = (width / anchoOriginal) * factorTamano;
      let escalaFondo = width / anchoOriginal;

      // 1. DIBUJAR EL FONDO
      image(imgFondo, width / 2, height / 2, width, height);

      // --- 2. DIBUJAR LA CÁMARA ---
      let camaraX = camaraXOriginal * escalaFondo;
      let camaraY = camaraYOriginal * escalaFondo;
      push();
      translate(camaraX, camaraY);
      scale(escalaFondo);
      rotate(radians(rotacionCamara));
      image(imgCamara, 0, 0);
      pop();

      // --- 3. ACTUALIZAR Y DIBUJAR LOS PECES ---
      for (let i = peces.length - 1; i >= 0; i--) {
        let p = peces[i];
        p.actualizar();
        p.dibujar();

        if (!p.permanente && p.fueraDePantalla()) {
          peces.splice(i, 1);
        }
      }

      let personajeX = width / 2;
      let personajeY = posYOriginal * escalaFondo;

      // --- DETECCIÓN DE HOVER PARA EL ZOOM ---
      let distanciaAlPersonaje = dist(mouseX, mouseY, personajeX, personajeY);
      let radioHover = 200 * escalaFondo; 

      let escalaObjetivo = 1.0;
      if (distanciaAlPersonaje < radioHover) {
        escalaObjetivo = 1.12 + sin(frameCount * 0.1) * 0.05;
      }

      escalaZoom = lerp(escalaZoom, escalaObjetivo, 0.1);
      impulsoClick = lerp(impulsoClick, 0, 0.1);
      let escalaTotal = escala * escalaZoom + impulsoClick;

      // 4. DIBUJAR ROSTRO BASE
      push();
      translate(personajeX, personajeY);
      scale(escalaTotal);
      image(imgRostro, 0, 0);
      pop();

      // CENTRO DE SEGUIMIENTO DE LOS OJOS
      let centroOjosX = personajeX + (relOjoX * escalaTotal);
      let centroOjosY = personajeY + (relOjoY * escalaTotal);

      // 5. DIBUJAR EL RESTO DE LOS OJOS
      push();
      translate(centroOjosX, centroOjosY);
      scale(escalaTotal);
      image(imgRestoOjos, 0, 0);
      pop();

      // 6. ANIMACIÓN DE LAS PUPILAS
      let angulo = atan2(mouseY - centroOjosY, mouseX - centroOjosX);
      let distanciaMouse = dist(mouseX, mouseY, centroOjosX, centroOjosY);
      
      let limiteMovimiento = 9 * escalaTotal; 
      let desplazamiento = map(distanciaMouse, 0, width / 2, 0, limiteMovimiento);
      desplazamiento = constrain(desplazamiento, 0, limiteMovimiento);

      let pupilaAnimadaX = centroOjosX + cos(angulo) * desplazamiento;
      let pupilaAnimadaY = centroOjosY + sin(angulo) * desplazamiento;

      // DIBUJAR PUPILAS
      push();
      translate(pupilaAnimadaX, pupilaAnimadaY);
      scale(escalaTotal);
      image(imgPupilas, 0, 0);
      pop();

      // --- 7. DIBUJAR COMPONENTES INFERIORES ---
      let bY = botonesYOriginal * escalaFondo;
      let anchoBoton = 320 * escalaFondo;
      let altoBoton = 140 * escalaFondo;

      let b1X = comprarXOriginal * escalaFondo;
      let b2X = ticketsXOriginal * escalaFondo;
      let b3X = japonXOriginal * escalaFondo;

      // 7.1 Flecha izquierda
      push();
      let flechaIzqX = b1X - (180 * escalaFondo);
      translate(flechaIzqX, bY);
      scale(escalaFondo * 0.75);
      rotate(radians(-4));
      image(imgFlecha, 0, 0);
      pop();

      // 7.2 Botón Comprar
      let targetHover1 = (mouseX > b1X - anchoBoton/2 && mouseX < b1X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) ? 1.12 : 1.0;
      hoverComprar = lerp(hoverComprar, targetHover1, 0.15);

      push();
      translate(b1X, bY);
      scale(escalaFondo * hoverComprar);
      rotate(radians(-3));
      image(imgComprar, 0, 0);
      pop();

      // 7.3 Estrella 1
      push();
      let estrella1X = (b1X + b2X) / 2 - (35 * escalaFondo);
      translate(estrella1X, bY + (5 * escalaFondo));
      scale(escalaFondo * 0.75);
      rotate(radians(15));
      image(imgEstrella, 0, 0);
      pop();

      // 7.4 Botón Tickets
      let targetHover2 = (mouseX > b2X - anchoBoton/2 && mouseX < b2X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) ? 1.12 : 1.0;
      hoverTickets = lerp(hoverTickets, targetHover2, 0.15);

      push();
      translate(b2X, bY);
      scale(escalaFondo * hoverTickets);
      rotate(radians(1.5));
      image(imgTickets, 0, 0);
      pop();

      // 7.5 Estrella 2
      push();
      let estrella2X = (b2X + b3X) / 2 + (35 * escalaFondo);
      translate(estrella2X, bY + (5 * escalaFondo));
      scale(escalaFondo * 0.75);
      rotate(radians(-10));
      image(imgEstrella, 0, 0);
      pop();

      // 7.6 Botón Japón
      let targetHover3 = (mouseX > b3X - anchoBoton/2 && mouseX < b3X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) ? 1.12 : 1.0;
      hoverJapon = lerp(hoverJapon, targetHover3, 0.15);

      push();
      translate(b3X, bY);
      scale(escalaFondo * hoverJapon);
      rotate(radians(-2));
      image(imgJapon, 0, 0);
      pop();

      // 7.7 Flecha derecha
      push();
      let flechaDerX = b3X + (180 * escalaFondo);
      translate(flechaDerX, bY);
      scale(escalaFondo * 0.75, escalaFondo * 0.75);
      scale(-1, 1);
      rotate(radians(4));
      image(imgFlecha, 0, 0);
      pop();

      // --- 8. PÓSTER, AURICULARES, CONEJO Y BOTÓN COMPRAR TUCHI ---
      let cartelX = width / 2;
      let cartelY = bY + (580 * escalaFondo);

      // 8.1 Póster
      push();
      translate(cartelX, cartelY);
      scale(escalaFondo * 1.05);
      image(imgCartel, 0, 0);
      pop();

      // 8.2 Auriculares
      let auricularesX = cartelX - (320 * escalaFondo);
      let auricularesY = cartelY - (340 * escalaFondo);
      push();
      translate(auricularesX, auricularesY);
      scale(escalaFondo * 0.75);
      rotate(radians(-12));
      image(imgAuriculares, 0, 0);
      pop();

      // 8.3 Conejo
      let conejoX = cartelX + (370 * escalaFondo);
      let conejoY = cartelY - (260 * escalaFondo);
      push();
      translate(conejoX, conejoY);
      scale(escalaFondo * 0.9);
      rotate(radians(8));
      image(imgConejo, 0, 0);
      pop();

      // 8.4 Botón Cartel "¡COMPRAR!"
      let comprarTuchiX = width / 2;
      let comprarTuchiY = cartelY + (640 * escalaFondo);
      let tuchiAncho = 680 * escalaFondo;
      let tuchiAlto = 220 * escalaFondo;

      let targetHoverTuchi = (mouseX > comprarTuchiX - tuchiAncho/2 && mouseX < comprarTuchiX + tuchiAncho/2 && mouseY > comprarTuchiY - tuchiAlto/2 && mouseY < comprarTuchiY + tuchiAlto/2) ? 1.08 : 1.0;
      hoverComprarTuchi = lerp(hoverComprarTuchi, targetHoverTuchi, 0.15);

      push();
      translate(comprarTuchiX, comprarTuchiY);
      scale(escalaFondo * hoverComprarTuchi);
      rotate(radians(-1.5));
      image(imgComprarTuchi, 0, 0);
      pop();

      // Estrella al lado del botón de comprar tuchi
      push();
      let estrellaTuchiX = comprarTuchiX + (380 * escalaFondo);
      let estrellaTuchiY = comprarTuchiY + (40 * escalaFondo);
      translate(estrellaTuchiX, estrellaTuchiY);
      scale(escalaFondo * 0.9);
      rotate(radians(18));
      image(imgEstrella, 0, 0);
      pop();

      // --- 9. DIBUJAR LAS POLAROIDS Y LUEGO CERO.PNG ARRIBA DE TODO ---
      for (let p of polaroids) {
        p.actualizar();
        p.dibujar(escalaFondo);
      }

      objCero.actualizar();
      objCero.dibujar(escalaFondo);

      // --- 10. CURSOR PERSONALIZADO ---
      push();
      imageMode(CORNER);
      let tamCursor = 40 * escalaFondo;
      image(imgClick, mouseX, mouseY, tamCursor, tamCursor);
      pop();
    }

    class Polaroid {
      constructor(x, y, img, rot, escalaBase) {
        this.x = x;
        this.y = y;
        this.img = img;
        this.rot = rot;
        this.escalaBase = escalaBase;
        this.arrastrando = false;
        this.offsetX = 0;
        this.offsetY = 0;
        this.vx = 0; 
        this.vy = 0; 
        this.prevX = x;
        this.prevY = y;
      }

      actualizar() {
        if (this.arrastrando) {
          this.vx = this.x - this.prevX;
          this.vy = this.y - this.prevY;
          this.prevX = this.x;
          this.prevY = this.y;

          this.x = mouseX + this.offsetX;
          this.y = mouseY + this.offsetY;
        } else {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.88; 
          this.vy *= 0.88;
        }
      }

      dibujar(escalaFondo) {
        push();
        translate(this.x, this.y);
        scale(escalaFondo * this.escalaBase);
        rotate(radians(this.rot));
        image(this.img, 0, 0);
        pop();
      }

      verificarPresionado(mx, my, escalaFondo) {
        let w = this.img.width * escalaFondo * this.escalaBase;
        let h = this.img.height * escalaFondo * this.escalaBase;
        
        if (mx > this.x - w/2 && mx < this.x + w/2 && my > this.y - h/2 && my < this.y + h/2) {
          this.arrastrando = true;
          this.offsetX = this.x - mx;
          this.offsetY = this.y - my;
          this.prevX = this.x;
          this.prevY = this.y;
          this.vx = 0;
          this.vy = 0;
          return true;
        }
        return false;
      }

      soltar() {
        this.arrastrando = false;
      }
    }

    class Pez {
      constructor(x, y, permanente = false) {
        this.x = x;
        this.y = y;
        this.vx = random(1, 3) * (random() > 0.5 ? 1 : -1);
        this.vy = random(-0.5, 0.5);
        this.tam = random(40, 80);
        this.anguloOndulacion = random(100);
        this.permanente = permanente; 
      }

      actualizar() {
        this.x += this.vx;
        this.y += this.vy + sin(this.anguloOndulacion) * 0.5; 
        this.anguloOndulacion += 0.1;

        if (this.permanente) {
          if (this.x < 50) {
            this.x = 50;
            this.vx *= -1; 
          } else if (this.x > width - 50) {
            this.x = width - 50;
            this.vx *= -1; 
          }

          if (this.y < 50) {
            this.y = 50;
            this.vy *= -1;
          } else if (this.y > height - 50) {
            this.y = height - 50;
            this.vy *= -1;
          }
        }
      }

      dibujar() {
        push();
        translate(this.x, this.y);
        if (this.vx < 0) {
          scale(-1, 1);
        }
        imageMode(CENTER);
        image(imgPez, 0, 0, this.tam, this.tam * 0.6);
        pop();
      }

      fueraDePantalla() {
        return (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150);
      }
    }

    function mousePressed() {
      let escalaFondo = width / anchoOriginal;

      let elementoAgarrado = false;

      // 1. Verificar si hacemos clic en cero.png o en las polaroids para arrastrarlas
      if (objCero.verificarPresionado(mouseX, mouseY, escalaFondo)) {
        elementoAgarrado = true;
      } else {
        for (let i = polaroids.length - 1; i >= 0; i--) {
          if (polaroids[i].verificarPresionado(mouseX, mouseY, escalaFondo)) {
            elementoAgarrado = true;
            let p = polaroids.splice(i, 1)[0];
            polaroids.push(p);
            break;
          }
        }
      }

      // 2. Si no agarramos ninguna imagen, evaluamos clics en los botones interactivos
      if (!elementoAgarrado) {
        let personajeX = width / 2;
        let personajeY = posYOriginal * escalaFondo;
        let radioHover = 200 * escalaFondo;

        let distanciaAlPersonaje = dist(mouseX, mouseY, personajeX, personajeY);
        if (distanciaAlPersonaje < radioHover) {
          impulsoClick = 0.25;
        }

        let bY = botonesYOriginal * escalaFondo;
        let anchoBoton = 320 * escalaFondo;
        let altoBoton = 140 * escalaFondo;

        let b1X = comprarXOriginal * escalaFondo;
        let b2X = ticketsXOriginal * escalaFondo;
        let b3X = japonXOriginal * escalaFondo;

        let cartelY = bY + (580 * escalaFondo);
        let comprarTuchiX = width / 2;
        let comprarTuchiY = cartelY + (640 * escalaFondo);
        let tuchiAncho = 680 * escalaFondo;
        let tuchiAlto = 220 * escalaFondo;

        // Comprar superior -> Passline
        if (mouseX > b1X - anchoBoton/2 && mouseX < b1X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) {
          window.open("https://www.passline.com/eventos/cero-en-c-art-media", "_blank");
        }
        // Tickets superior -> Passline
        else if (mouseX > b2X - anchoBoton/2 && mouseX < b2X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) {
          window.open("https://www.passline.com/eventos/cero-en-c-art-media", "_blank");
        }
        // Japón superior -> Web de ceroasterisco
        else if (mouseX > b3X - anchoBoton/2 && mouseX < b3X + anchoBoton/2 && mouseY > bY - altoBoton/2 && mouseY < bY + altoBoton/2) {
          window.open("https://www.ceroasterisco.com/#japon", "_blank");
        }
        // Botón inferior de compra -> Tienda Nube (remera)
        else if (mouseX > comprarTuchiX - tuchiAncho/2 && mouseX < comprarTuchiX + tuchiAncho/2 && mouseY > comprarTuchiY - tuchiAlto/2 && mouseY < comprarTuchiY + tuchiAlto/2) {
          window.open("https://spdvmerch.mitiendanube.com/productos/remera-cero-x-enzo-11uje/", "_blank");
        }
        else {
          // Si el clic fue en cualquier otro espacio vacío de la pantalla, nacen los peces
          for (let i = 0; i < random(1, 3); i++) {
            peces.push(new Pez(mouseX, mouseY, false));
          }
        }
      }
    }

    function mouseReleased() {
      for (let p of polaroids) {
        p.soltar();
      }
      objCero.soltar();
    }

    function windowResized() {
      let altoCalculado = windowWidth * (altoOriginal / anchoOriginal);
      resizeCanvas(windowWidth, altoCalculado);
    }
  </script>

</body>
</html>
